$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
command: |
  git clone https://github.com/srepho/meno.git
  cd meno
  python -m pip install --upgrade pip
  pip install pytest pytest-cov
  pip install -e ".[embeddings-gpu,viz,clustering,nlp,dev,test]"
  python -m spacy download en_core_web_sm
  pip install -e ".[simple_models,additional_models]"
  python -c "import torch; print('CUDA available:', torch.cuda.is_available()); print('CUDA device count:', torch.cuda.device_count())"
  pytest tests/test_optimized_embedding.py --cov=meno.modeling.embeddings --cov-report=xml
  echo "GPU tests completed successfully"
name: meno-gpu-test
environment: 
  name: meno-gpu-env
  image: mcr.microsoft.com/azureml/pytorch-1.13-cuda11.6-cudnn8-ubuntu20.04
compute:
  target: meno-gpu-compute
display_name: Meno GPU Test Suite
description: Run Meno GPU optimization tests in Azure ML environment
tags:
  gpu: True
  repository: meno
  test_type: gpu_optimization
environment_variables:
  PYTHONPATH: ${{parent.inputs.source_directory}}
  CUDA_VISIBLE_DEVICES: 0
distribution:
  type: pytorch
resources:
  instance_count: 1
  instance_type: Standard_NC6s_v3