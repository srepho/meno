$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
code: ../
command: >
  pip install -e ".[gpu,dev,test]" &&
  pip install pytest pytest-cov &&
  python -c "import torch; print('CUDA available:', torch.cuda.is_available())" &&
  pytest tests/test_optimized_embedding.py -v &&
  pytest tests/test_bertopic_model.py tests/test_embedding_functional.py -v
environment: 
  name: meno-gpu-env
  image: mcr.microsoft.com/azureml/pytorch-1.11-ubuntu20.04-py38-cuda11-gpu
compute: gpu-cluster
display_name: meno-gpu-tests
experiment_name: meno-gpu-testing
description: Run GPU tests for Meno package