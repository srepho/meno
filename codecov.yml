codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "60...85"
  status:
    project:
      default:
        # basic settings
        target: auto
        threshold: 1%
        base: auto
        # advanced settings
        branches: null
        if_not_found: success
        if_ci_failed: error
        informational: false
        only_pulls: false
    patch:
      default:
        # basic settings
        target: auto
        threshold: 5%
        base: auto
        # advanced settings
        branches: null
        if_not_found: success
        if_ci_failed: error
        informational: false
        only_pulls: false

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes
  branches: null

ignore:
  - "examples/**/*"
  - "docs/**/*"
  - "tests/**/*"
  - "build/**/*"
  - "dist/**/*"
  - "setup.py"
  - "*.md"

flags:
  unittests:
    paths:
      - meno/
  gpu-tests:
    paths:
      - meno/modeling/embeddings.py
      - meno/modeling/bertopic_model.py
  python-3.8:
    paths:
      - meno/
  python-3.10:
    paths:
      - meno/
  python-3.11:
    paths:
      - meno/
  python-3.12:
    paths:
      - meno/