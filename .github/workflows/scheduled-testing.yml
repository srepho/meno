name: Scheduled Testing

on:
  schedule:
    - cron: '0 0 * * 1'  # Run weekly on Monday at midnight
  workflow_dispatch:  # Allow manual triggering

jobs:
  # Test across multiple Python versions including the latest
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        include:
          - python-version: '3.8'
            test-suite: 'essential'
          - python-version: '3.9'
            test-suite: 'essential'
          - python-version: '3.10'
            test-suite: 'full'
          - python-version: '3.11'
            test-suite: 'full'
          - python-version: '3.12'
            test-suite: 'compatibility'

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov ruff mypy black
        
        # Install core dependencies for all versions
        pip install -e ".[minimal,dev,test]"
        
        # For full test suite, install all dependencies
        if [ "${{ matrix.test-suite }}" = "full" ]; then
          pip install -e ".[embeddings,viz,clustering,nlp]"
          python -m spacy download en_core_web_sm
          pip install -e ".[simple_models,additional_models]"
        fi
        
        # For essential test suite, install basic dependencies
        if [ "${{ matrix.test-suite }}" = "essential" ]; then
          pip install -e ".[embeddings,viz]"
          python -m spacy download en_core_web_sm
        fi
    
    - name: Run tests based on test suite
      run: |
        if [ "${{ matrix.test-suite }}" = "full" ]; then
          pytest tests/ --cov=meno --cov-report=xml
        elif [ "${{ matrix.test-suite }}" = "essential" ]; then
          pytest tests/test_workflow.py tests/test_config.py tests/test_preprocessing.py --cov=meno --cov-report=xml
        elif [ "${{ matrix.test-suite }}" = "compatibility" ]; then
          pytest tests/test_workflow.py tests/test_config.py --cov=meno --cov-report=xml
        fi
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: python-${{ matrix.python-version }}
        fail_ci_if_error: false
  
  # Test installation options
  installation-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Test minimal installation
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[minimal]"
        python -c "import meno; print(f'Meno version: {meno.__version__}')"
    
    - name: Test CPU-optimized installation
      run: |
        pip install -e ".[embeddings,viz,clustering,nlp]" -f https://download.pytorch.org/whl/torch_stable.html
        python -c "from meno.modeling.embeddings import DocumentEmbedding; model = DocumentEmbedding(model_name='all-MiniLM-L6-v2', device='cpu'); print('Embedding model loaded successfully')"
    
    - name: Test full installation
      run: |
        pip install -e ".[full]" -f https://download.pytorch.org/whl/torch_stable.html
        python -c "from meno.modeling.bertopic_model import BERTopicModel; from meno.modeling.simple_models.lightweight_models import TFIDFTopicModel; print('All models loaded successfully')"