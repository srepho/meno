name: Scheduled Testing

on:
  schedule:
    - cron: '0 4 * * 1'  # Run every Monday at 4:00 AM UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-all-python-versions:
    name: Test Multiple Python Versions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e ".[cpu,dev,test]"

    - name: Run CPU tests
      run: |
        pytest tests/ --ignore=tests/test_optimized_embedding.py --cpu-only -v
        
    - name: Report status
      run: |
        echo "Tests completed for Python ${{ matrix.python-version }}"

  test-dependency-versions:
    name: Test with Latest Dependencies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install latest dependencies
      run: |
        python -m pip install --upgrade pip
        # Install dependencies without version constraints
        sed 's/>=.*,\s*</</g; s/>=.*</</g' pyproject.toml > pyproject_latest.toml
        pip install -e ".[cpu,dev,test]"
        
    - name: Run compatibility tests
      run: |
        # Run a subset of tests to verify compatibility
        pytest tests/test_lightweight_models.py tests/test_preprocessing.py -v
        
    - name: Report compatibility status
      run: |
        echo "Compatibility tests with latest dependencies completed"
        
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        pip install -e ".[cpu,dev,test]"
        
    - name: Run integration tests
      run: |
        # Run only integration tests
        pytest tests/test_workflow.py tests/test_integration.py tests/test_integration_functional.py -v
        
    - name: Generate report
      run: |
        echo "Integration tests completed"

  notify:
    name: Notify on failures
    needs: [test-all-python-versions, test-dependency-versions, integration-test]
    runs-on: ubuntu-latest
    if: ${{ failure() }}
    
    steps:
    - name: Send notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: ${{ secrets.MAIL_SERVER }}
        server_port: ${{ secrets.MAIL_PORT }}
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: "[FAILED] Scheduled tests for Meno"
        body: |
          Scheduled tests for Meno have failed.
          
          Please check the GitHub Actions logs for more details:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        to: ${{ secrets.MAIL_RECIPIENT }}
        from: GitHub Actions
      # Continue even if email notification fails
      continue-on-error: true
      
    - name: Create issue on failure
      uses: actions/github-script@v6
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '⚠️ Scheduled tests failed',
            body: `Scheduled tests have failed on ${new Date().toISOString().split('T')[0]}.
            
            ### Failed workflow
            
            ${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}
            
            Please investigate and fix the failing tests.`
          })