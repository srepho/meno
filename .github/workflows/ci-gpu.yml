name: CI Tests (GPU)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 3'  # Run weekly on Wednesday at midnight

jobs:
  test-gpu:
    # Use self-hosted runner with GPU
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Verify CUDA is available
      run: |
        python -c "import torch; print('CUDA available:', torch.cuda.is_available()); print('CUDA device count:', torch.cuda.device_count()); print('CUDA version:', torch.version.cuda)"
    
    - name: Install dependencies with GPU support
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        # Install with GPU support
        pip install -e ".[embeddings-gpu,viz,clustering,nlp,dev,test]"
        # Install spaCy model separately
        python -m spacy download en_core_web_sm
        # Install remaining GPU-specific dependencies
        pip install -e ".[simple_models,additional_models]"
    
    - name: Run GPU-specific tests
      run: |
        # Run only GPU-specific tests
        pytest tests/test_optimized_embedding.py --cov=meno.modeling.embeddings --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: gpu-tests
        fail_ci_if_error: false

  # Alternative GPU job using Azure ML for organizations without self-hosted runners
  test-gpu-azure:
    # Only run this job if explicitly triggered manually or via scheduled workflow
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install Azure CLI and ML extension
      run: |
        pip install azure-cli azure-cli-ml
        az extension add -n azure-cli-ml
    
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Submit job to Azure ML
      run: |
        az ml job create --file .azure/gpu-test-job.yml --workspace-name meno-ml-workspace --resource-group meno-resources