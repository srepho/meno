name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly scan on Sunday at midnight

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags
    
    - name: Install detect-secrets
      run: |
        python -m pip install --upgrade pip
        pip install detect-secrets
    
    - name: Scan for secrets with detect-secrets
      run: |
        detect-secrets scan --all-files --exclude-files "\.env\.example$" > detect-secrets-results.json
    
    - name: Check for detected secrets
      run: |
        if [ -s detect-secrets-results.json ] && [ "$(grep -c "results" detect-secrets-results.json)" -gt 0 ]; then
          echo "Potential secrets detected. Please check the output."
          cat detect-secrets-results.json
          exit 1
        else
          echo "No secrets detected. Good job!"
        fi
    
    - name: Upload scan results as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: detect-secrets-results
        path: detect-secrets-results.json
  
  trufflehog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags
    
    - name: TruffleHog OSS
      uses: trufflesecurity/trufflehog@v3.28.0
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --only-verified
        
    - name: Upload trufflehog results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: trufflehog-results
        path: trufflehog-results.json
        if-no-files-found: ignore