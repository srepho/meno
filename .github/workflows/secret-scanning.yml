name: Secret Scanning

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  detect-secrets:
    name: Detect Secrets
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Fetch all history for all branches and tags

    # Use GitHub's built-in secret scanning alerts
    - name: GitHub Secret Scanning
      uses: actions/github-script@v6
      with:
        script: |
          console.log("Using GitHub's built-in secret scanning alerts")
          console.log("Secret scanning alerts are available in the Security tab")

    # Use Yelp's detect-secrets for enhanced scanning
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install detect-secrets
      run: |
        pip install detect-secrets
        
    - name: Run detect-secrets
      run: |
        detect-secrets scan --all-files > secrets.json
        
    - name: Check for secrets
      run: |
        python -c "
        import json
        with open('secrets.json', 'r') as f:
            results = json.load(f)
        secrets_found = len(results.get('results', {})) > 0
        if secrets_found:
            print('⚠️ Potential secrets found in code!')
            print(json.dumps(results.get('results'), indent=2))
            exit(1)
        else:
            print('✅ No secrets found in code')
        "
        
    # Use truffleHog for more comprehensive checks
    - name: Install truffleHog
      run: |
        pip install trufflehog
        
    - name: Run truffleHog
      run: |
        trufflehog filesystem . --no-update --only-verified > trufflehog_results.txt || true
        
    - name: Check truffleHog results
      run: |
        if [ -s trufflehog_results.txt ]; then
          echo "⚠️ Potential secrets found with truffleHog:"
          cat trufflehog_results.txt
          exit 1
        else
          echo "✅ No secrets found with truffleHog"
        fi
        
    # Scan for specific patterns like API keys, passwords, etc.
    - name: Custom pattern scanning
      run: |
        # Create a temporary file for grep results
        touch grep_results.txt
        
        # Define patterns to search for
        echo "Scanning for potential API keys, passwords, and credentials..."
        
        # Check for potential API keys
        grep -r --include="*.py" --include="*.ipynb" --include="*.md" --include="*.yaml" --include="*.json" \
          -E "(api[_-]?key|apikey|key|token|password|secret|credential)[\"']?\s*[:=]\s*[\"'][A-Za-z0-9_\-]{16,}[\"']" \
          --exclude-dir={.git,venv,__pycache__} . | grep -v "your-api-key" | grep -v "OPENAI_API_KEY" | grep -v "sample" >> grep_results.txt || true
        
        # Check for potential passwords
        grep -r --include="*.py" --include="*.ipynb" --include="*.md" --include="*.yaml" --include="*.json" \
          -E "(password|passwd|pwd|auth)[\"']?\s*[:=]\s*[\"'][^\"']{8,}[\"']" \
          --exclude-dir={.git,venv,__pycache__} . | grep -v "your-password" | grep -v "password123" | grep -v "sample" >> grep_results.txt || true
        
        # Check for AWS credentials
        grep -r --include="*.py" --include="*.ipynb" --include="*.md" --include="*.yaml" --include="*.json" \
          -E "AKIA[0-9A-Z]{16}" \
          --exclude-dir={.git,venv,__pycache__} . >> grep_results.txt || true
        
        # Check results
        if [ -s grep_results.txt ]; then
          echo "⚠️ Potential secrets found with custom pattern scanning:"
          cat grep_results.txt
          echo "Please review these findings and ensure no real credentials are committed."
          echo "If these are examples, consider using placeholders like 'YOUR_API_KEY_HERE' instead."
          exit 1
        else
          echo "✅ No secrets found with custom pattern scanning"
        fi
        
    - name: Summary
      run: |
        echo "✅ All secret scanning checks passed"