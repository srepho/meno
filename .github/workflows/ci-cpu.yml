name: CI Tests (CPU)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.12']

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov ruff mypy black
        # Install package without Spacy model first
        pip install -e ".[embeddings,viz,clustering,nlp,dev,test]"
        # Install spaCy model separately
        python -m spacy download en_core_web_sm
        # Install remaining dependencies
        pip install -e ".[simple_models,additional_models]"
    - name: Run tests
      run: |
        pytest tests/ --cov=meno --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false