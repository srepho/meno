name: CI/CD (CPU)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual triggering

jobs:
  test-cpu:
    name: Test on CPU
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.12']
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov ruff mypy black
        # Install package without Spacy model first
        pip install -e ".[embeddings,viz,clustering,nlp,dev,test]"
        # Install spaCy model separately
        python -m spacy download en_core_web_sm
        # Install remaining dependencies
        pip install -e ".[simple_models,additional_models]"
        # Install test dependencies
        if [ -f requirements_test.txt ]; then pip install -r requirements_test.txt; fi

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check .
        
    - name: Check with black
      run: |
        black --check .
        
    - name: Type check with mypy
      run: |
        mypy meno/ || true  # Don't fail the build, just report results
        
    - name: Run lightweight tests
      run: |
        pytest tests/test_lightweight_models.py tests/test_config.py -v
        
    - name: Run basic CPU tests
      run: |
        # Run a subset of tests that don't require full models
        pytest tests/test_preprocessing.py tests/test_modeling.py -v
        
    - name: Run all CPU tests with coverage
      run: |
        pytest tests/ --ignore=tests/test_optimized_embedding.py --cpu-only -v --cov=meno
        
    - name: Generate coverage report
      run: |
        coverage report
        coverage xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
        
  build-package:
    name: Build and validate package
    runs-on: ubuntu-latest
    needs: test-cpu
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        
    - name: Build package
      run: |
        python -m build
        
    - name: Check package with twine
      run: |
        twine check dist/*
        
    - name: Upload package artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package-distributions
        path: dist/
        
  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx-rtd-theme
        pip install -e .
        
    - name: Build docs
      run: |
        cd docs
        make html || echo "Documentation build step skipped - setup full documentation build later"
        
    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/_build/html/
      if: false  # Disabled until proper documentation setup